<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Messenger Inquiry | Ads Journey</title>
<link rel="stylesheet" href="intake.css">
</head>
<body>
<header class="topbar">
  <div>
    <p class="eyebrow">The Little Nest Playschool</p>
    <h1>Messenger Intake</h1>
  </div>
  <div class="topbar-actions">
    <span id="userName" class="user-name">Loading…</span>
    <button id="logoutButton" class="secondary-button" type="button">Log out</button>
  </div>
</header>
<main class="page-shell">
  <section class="form-card">
    <form id="inquiryForm" novalidate>
      <div class="field-grid two-column">
        <div class="field">
          <label for="facebookName">Facebook name <span>*</span></label>
          <input id="facebookName" name="facebook_name" type="text" autocomplete="off" required placeholder="AlexRose Pitogo">
        </div>
        <div class="field">
          <label for="franchiseId">Branch / location <span>*</span></label>
          <select id="franchiseId" name="franchise_id" required disabled>
            <option value="">Loading branches…</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="facebookProfileUrl">Facebook profile URL <span>*</span></label>
        <input id="facebookProfileUrl" name="facebook_profile_url" type="url" autocomplete="off" required placeholder="https://facebook.com/username">
        <p class="field-help">Open the parent's Facebook profile and paste the URL here.</p>
      </div>
      <div class="field-grid two-column">
        <div class="field">
          <label for="facebookUsername">Facebook username</label>
          <input id="facebookUsername" name="facebook_username" type="text" autocomplete="off" placeholder="username">
        </div>
        <div class="field">
          <label for="adId">Ad ID</label>
          <input id="adId" name="ad_id" type="text" autocomplete="off" placeholder="120249070251960208">
        </div>
      </div>
      <div class="field-grid two-column">
        <div class="field">
          <label for="firstMessageAt">First message time <span>*</span></label>
          <input id="firstMessageAt" name="first_message_at" type="datetime-local" required>
        </div>
        <div class="field">
          <label for="inquiryType">Initial inquiry</label>
          <select id="inquiryType" name="inquiry_type">
            <option value="">Select if known</option>
            <option value="rates">Rates / tuition</option>
            <option value="schedule">Schedule</option>
            <option value="location">Location</option>
            <option value="free_trial">Free trial</option>
            <option value="enrollment">Enrollment</option>
            <option value="age_group">Age group</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="initialNote">Initial note</label>
        <textarea id="initialNote" name="initial_note" rows="4" placeholder="Example: Asked for location and tuition for a 2-year-old."></textarea>
      </div>
      <div id="duplicateStatus" hidden></div>
      <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>
      <div class="form-actions">
        <button id="clearButton" class="secondary-button" type="button">Clear</button>
        <button id="saveButton" class="primary-button" type="submit">Create Inquiry</button>
      </div>
    </form>
  </section>
</main>
<div id="messageModal" class="message-modal" hidden>
  <div class="message-modal-backdrop"></div>
  <section class="message-modal-card" role="alertdialog" aria-modal="true" aria-labelledby="messageModalTitle" aria-describedby="messageModalText">
    <p class="section-kicker">Messenger Intake</p>
    <h3 id="messageModalTitle">Unable to create inquiry</h3>
    <p id="messageModalText"></p>
    <div class="message-modal-actions">
      <button id="messageModalOk" class="primary-button" type="button">OK</button>
    </div>
  </section>
</div>
<script src="intake.js"></script>
</body>
</html>
