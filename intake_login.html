<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messenger Intake | The Little Nest</title>
<link rel="stylesheet" href="intake_login.css?v=20261004-0604">
</head>
<body>
<main class="login-shell">
<section class="login-card" aria-labelledby="login-title">
<div class="brand-mark">TLN</div>
<p class="eyebrow">The Little Nest Playschool</p>
<h1 id="login-title">Messenger Intake</h1>
<p class="subtext">Sign in to record new Facebook conversations as they begin.</p>
<form id="loginForm" novalidate>
<label for="email">Email</label>
<input id="email" name="email" type="email" autocomplete="username" required>
<label for="password">Password</label>
<div class="password-wrap">
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button id="togglePassword" class="password-toggle" type="button" aria-label="Show password">Show</button>
</div>
<button id="loginButton" class="login-button" type="submit">Sign In</button>
<p id="loginMessage" class="login-message" role="alert" aria-live="polite"></p>
</form>
</section>
</main>
<script src="intake_login.js"></script>
</body>
</html>
